[package]
name = "mezame"
version = "0.14.0-alpha.1"
edition = "2021"
rust-version = "1.86"
build = "build.rs"
description = "An agent harness with a browser front end: one session, many devices, over WebSockets."
license = "MIT"
readme = "README.md"
repository = "https://github.com/aichholzer/mezame"
keywords = ["agent", "harness", "assistant", "cli", "websocket"]
categories = ["command-line-utilities", "web-programming::websocket"]
# `ui/node_modules/` is populated by `build.rs` inside `$OUT_DIR` and
# never reaches the source tree during a clean build. We also ignore it
# via `.gitignore`. Excluded explicitly here for belt-and-braces. Assets
# and the changelog are not needed at build time; the README links to
# raw.githubusercontent.com for the banner image. The plan (`HARNESS.md`),
# the review (`findings.md`) and the UI design reference (`reference.html`)
# are repository documents, not crate contents; the `docs` CI job fails if
# `cargo package --list` names one of them.
exclude = [
    "ui/node_modules/**",
    "ui/dist/**",
    "ui/src/__test_setup.ts",
    "ui/src/__test_utils.tsx",
    "ui/vitest.config.ts",
    "tests/**",
    ".github/**",
    "utilities/**",
    "assets/**",
    "docs/**",
    "Dockerfile",
    "compose.yaml",
    "CHANGELOG.md",
    "benches/**",
    "HARNESS.md",
    "findings.md",
    "reference.html",
    "ui/tsconfig.test.json"
]

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.7.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
dialoguer = { version = "0.12.0", default-features = false }
futures-util = "0.3.31"
# Not a new crate at this lockfile: 0.2 is what axum's `ws` feature already
# pulls in (tokio-tungstenite 0.24 -> tungstenite -> rand 0.8 -> rand_core
# 0.6 -> getrandom 0.2), and this line unifies with it. Bump it, and the
# tokio-tungstenite dev-dependency with it, the first time
# `cargo tree -i getrandom@0.2` lists only mezame: that is the axum bump
# whose tungstenite moves to rand 0.9. The 0.3 API renamed the call:
# `getrandom::getrandom(&mut buf)` becomes `getrandom::fill(&mut buf)`.
getrandom = "0.2"
# Both already in the normal graph through axum, so zero new crates. They
# are direct dependencies because `axum::serve` sets no timer on hyper,
# which silently disables hyper's header-read timeout; `http::serve` owns
# the accept loop and sets one. See the serve function's doc comment.
hyper = { version = "1.9", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "service"] }
rust-embed = { version = "8.5.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
socket2 = "0.5"
tokio = { version = "1.43.0", features = ["fs", "macros", "rt-multi-thread", "net", "sync", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1.43.0", features = ["test-util"] }
proptest = "1.11"
tempfile = "3.13"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
divan = { version = "5.0.0", package = "codspeed-divan-compat" }

[[bench]]
name = "http_parsing"
harness = false
