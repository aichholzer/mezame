# Mezame on Alpine, orchestrated with Docker Compose.
#
# First-run setup (interactive, one-off):
#   docker compose run --rm setup
#
# That runs `mezame init`, which asks for the address to bind, the admin
# account, then the Bedrock model, region and profile. Choose 0.0.0.0:9510
# for the bind. The default, 127.0.0.1:9510, binds loopback inside the
# container, and the published port below would then answer nothing.
# Without a terminal, the same setup with no prompt:
#   echo 'the password' | docker compose run -T --rm setup mezame init \
#     --bind 0.0.0.0:9510 --admin alice --password-stdin --model global.anthropic.claude-sonnet-5
#
# Credentials never live in the image or the volume. The `environment`
# list on the `mezame` service names the AWS variables bare, which passes
# each one through from the host's environment when it is set and sets
# nothing when it is not, so the file stays valid on a host with none. For
# a profile, uncomment the `~/.aws` mount: it is read-only, which the
# read-only root filesystem permits. Read-only also means the SDK cannot
# refresh an `sso-session` token as it nears expiry, so log in again on
# the host when turns start failing for credentials, or mount
# `~/.aws/sso/cache` writable. Mounting a credentials directory into a
# container is your call, which is why it ships commented.
#
# The port is published on the host's loopback only: the browser on the
# host reaches it at http://127.0.0.1:9510 and nothing else does. The
# login gates who gets in, and loopback keeps the session cookie off the
# network. To reach it from other machines on a network you trust, change
# the mapping to "0.0.0.0:9510:9510", knowing the cookie then crosses that
# network over plain HTTP. On Linux, Docker's own firewall rules bypass
# ufw, so that opens the port on every network the host is on; a
# Cloudflare Tunnel running on the host reaches the loopback mapping as
# it is and brings TLS.
#
# The container runs as user `mezame` (uid 1000) with its files at
# /home/mezame/.mezame (the config, the datastore and the master key, on
# the named volume), on a read-only root filesystem, with every
# capability dropped and no privilege escalation. Start from a fresh
# volume: one created by an earlier version is not carried over, and
# `docker compose down -v` removes it. Docker lets the container bind any
# port without a capability, so nothing refuses a custom port; but a bind
# on a port other than 9510 needs the `ports:` mapping below and the
# image's health check changed to match, or the published port answers
# nothing and the container reports unhealthy.
#
# Normal run, and after pulling a new version:
#   docker compose up -d --build
#
# `up -d` alone starts whatever `mezame:local` is already on this machine;
# `--build` rebuilds it first. `docker compose run --rm --build setup` does
# the same before first-run setup.
#
# Both services share the same image and the same volume, so the config
# written during setup is what the running service reads. The image's
# health check fetches / on port 9510 inside the container; `docker ps`
# shows `healthy` once Mezame answers, and `docker compose up --wait`
# blocks on it.

services:
  mezame:
    build: .
    image: mezame:local
    container_name: mezame
    command: ["mezame"]
    ports:
      - "127.0.0.1:9510:9510"
    environment:
      - AWS_PROFILE
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_BEARER_TOKEN_BEDROCK
    volumes:
      - mezame-config:/home/mezame/.mezame
      # - ~/.aws:/home/mezame/.aws:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # One-shot service for first-run setup. Same image, same volume, but
  # interactive and without publishing the port. Invoked explicitly via
  # `docker compose run --rm setup`; never started by `docker compose up`
  # thanks to the `setup` profile. It runs `mezame init`, never a server,
  # so the image's health probe is switched off for it.
  setup:
    build: .
    image: mezame:local
    profiles: ["setup"]
    command: ["mezame", "init"]
    stdin_open: true
    tty: true
    volumes:
      - mezame-config:/home/mezame/.mezame
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true

volumes:
  mezame-config:
